version: 2

project_name: agentline

builds:
  - id: agentline
    main: ./cmd/agentline
    binary: agentline
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/HelgeSverre/agentline/internal/cli.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - ids:
      - agentline
    formats:
      - tar.gz
    name_template: "agentline_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
