app = "agentline"
primary_region = "arn"

kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

  [http_service.http_options]
    idle_timeout = 120

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    protocol = "http"
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

[[mounts]]
  source = "agentline_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
